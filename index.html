<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一個小問題 💌</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh; min-height: 100dvh;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif TC', serif;
    overflow: hidden;
    touch-action: none;
  }

  .heart-particle {
    position: fixed; bottom: -50px;
    opacity: 0; pointer-events: none; z-index: 0; user-select: none;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
    10%  { opacity: 0.25; }
    90%  { opacity: 0.12; }
    100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  .card {
    position: relative; z-index: 10;
    background: white; border-radius: 24px;
    padding: 44px 48px 40px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    width: min(88vw, 360px);
    animation: cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardIn {
    from { transform: scale(0.5) translateY(60px); opacity: 0; }
    to   { transform: scale(1) translateY(0); opacity: 1; }
  }
  .emoji-top {
    font-size: 3rem; margin-bottom: 14px; display: block;
    animation: wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%,100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }
  h1 {
    font-size: 1.45rem; font-weight: 700; color: #1a1a1a;
    line-height: 1.6; margin-bottom: 32px; letter-spacing: 0.04em;
  }
  #yes-btn {
    background: linear-gradient(135deg, #e84444, #c0392b);
    color: white; border: none; border-radius: 14px;
    padding: 16px 40px; font-size: 1.15rem;
    font-family: 'Noto Serif TC', serif; font-weight: 700;
    cursor: pointer; letter-spacing: 0.08em;
    box-shadow: 0 4px 20px rgba(232,68,68,0.5);
    display: block; width: 100%;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative; z-index: 2;
  }
  #yes-btn:active { transform: scale(0.96); }

  /* ★ 假圖示：pointer-events:none，無法被點擊、觸碰 */
  #no-fake {
    position: fixed;
    pointer-events: none;
    user-select: none;
    z-index: 20;
    color: #aaa;
    border: 1.5px solid #ddd;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 1rem;
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 0.05em;
    white-space: nowrap;
    background: rgba(255,255,255,0.03);
  }

  #chase-msg {
    position: fixed;
    bottom: max(36px, env(safe-area-inset-bottom, 36px));
    left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 0.88rem; letter-spacing: 0.04em;
    pointer-events: none; z-index: 5;
    text-align: center; white-space: nowrap;
  }

  #success-screen {
    display: none; position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #ff6b8a 0%, #c0392b 55%, #7b1818 100%);
    z-index: 100; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px;
    animation: successIn 0.5s cubic-bezier(0.34,1.2,0.64,1) both;
  }
  @keyframes successIn {
    from { clip-path: circle(0% at 50% 50%); }
    to   { clip-path: circle(150% at 50% 50%); }
  }
  #success-screen .big-emoji {
    font-size: 5.5rem; margin-bottom: 20px;
    animation: popIn 0.5s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  #success-screen h2 {
    font-size: 2.2rem; font-weight: 900; color: white;
    letter-spacing: 0.06em; text-shadow: 0 2px 16px rgba(0,0,0,0.3);
    animation: popIn 0.5s 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    margin-bottom: 10px;
  }
  #success-screen p {
    font-size: 1.15rem; color: rgba(255,255,255,0.88);
    animation: popIn 0.5s 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    letter-spacing: 0.05em; line-height: 1.7;
  }
  .confetti-piece {
    position: fixed; pointer-events: none; z-index: 200;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg) scale(0.2); opacity: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <span class="emoji-top">🥺</span>
  <h1>你願意跟我再一起嗎？</h1>
  <button id="yes-btn" onclick="handleYes()">同 意</button>
</div>

<!-- 純視覺假圖示，pointer-events:none，永遠點不到 -->
<div id="no-fake">不同意</div>

<div id="chase-msg">試著點點看 👆</div>

<div id="success-screen">
  <div class="big-emoji">🎉</div>
  <h2>太好了！！！</h2>
  <p>我就知道你捨不得 💖<br>從此以後要好好的喔</p>
</div>

<script>
  const fake = document.getElementById('no-fake');
  const msg  = document.getElementById('chase-msg');
  const MSGS = [
    '試著點點看 👆',
    '追不到喔 😏',
    '再試試看？🤭',
    '跑很快吧～',
    '乖乖點同意 💕',
    '不可能啦！😂',
    '累了嗎？點同意吧 🥰',
    '好累喔…',
    '我等你喔 ❤️',
  ];

  let escapeCount = 0;
  let cooldown = false;
  let fakeX = 0, fakeY = 0;

  function init() {
    fakeX = window.innerWidth  / 2 - (fake.offsetWidth  || 90) / 2;
    fakeY = window.innerHeight * 0.72;
    fake.style.transition = 'none';
    applyPos();
  }
  window.addEventListener('load', () => setTimeout(init, 700));
  window.addEventListener('resize', init);

  function applyPos() {
    fake.style.left = fakeX + 'px';
    fake.style.top  = fakeY + 'px';
  }

  function runAway(touchX, touchY) {
    if (cooldown) return;
    cooldown = true;
    escapeCount++;

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const fw = fake.offsetWidth  || 90;
    const fh = fake.offsetHeight || 46;
    const margin = 16;

    // 往反方向逃
    const cx = fakeX + fw / 2;
    const cy = fakeY + fh / 2;
    const dx = cx - touchX;
    const dy = cy - touchY;
    const len = Math.hypot(dx, dy) || 1;
    const dist = Math.min(vw, vh) * 0.55;

    let newX = cx + (dx / len) * dist - fw / 2 + (Math.random() - 0.5) * 80;
    let newY = cy + (dy / len) * dist - fh / 2 + (Math.random() - 0.5) * 80;

    // 邊界
    newX = Math.max(margin, Math.min(vw - fw - margin, newX));
    newY = Math.max(margin, Math.min(vh - fh - margin, newY));

    fakeX = newX;
    fakeY = newY;

    fake.style.transition = 'left 0.2s cubic-bezier(0.34,1.4,0.64,1), top 0.2s cubic-bezier(0.34,1.4,0.64,1)';
    applyPos();

    // 越逃越小越淡
    fake.style.fontSize = Math.max(0.5, 1 - escapeCount * 0.035) + 'rem';
    fake.style.opacity  = Math.max(0.3, 1 - escapeCount * 0.025);

    msg.textContent = MSGS[Math.min(escapeCount, MSGS.length - 1)];

    setTimeout(() => { cooldown = false; }, 220);
  }

  // 電腦：mousemove 靠近 70px 就跑
  document.addEventListener('mousemove', e => {
    if (cooldown) return;
    const fw = fake.offsetWidth  || 90;
    const fh = fake.offsetHeight || 46;
    if (Math.hypot(e.clientX - (fakeX + fw/2), e.clientY - (fakeY + fh/2)) < 70)
      runAway(e.clientX, e.clientY);
  });

  // 手機：touchstart + touchmove 靠近 100px 就跑
  function onTouch(e) {
    const t = e.touches[0]; if (!t) return;
    const fw = fake.offsetWidth  || 90;
    const fh = fake.offsetHeight || 46;
    if (Math.hypot(t.clientX - (fakeX + fw/2), t.clientY - (fakeY + fh/2)) < 100)
      runAway(t.clientX, t.clientY);
  }
  document.addEventListener('touchstart', onTouch, { passive: true });
  document.addEventListener('touchmove',  onTouch, { passive: true });

  function handleYes() {
    fake.style.display = 'none';
    msg.style.display  = 'none';
    document.getElementById('success-screen').style.display = 'flex';
    launchConfetti();
  }

  function launchConfetti() {
    const emojis = ['💖','💗','💓','💞','🌸','✨','🎊','💝','🩷','💕','🎉','⭐'];
    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (5 + Math.random() * 90) + 'vw';
        el.style.top  = '-30px';
        el.style.fontSize = (1 + Math.random() * 2) + 'rem';
        el.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }, i * 55);
    }
  }

  const heartChars = ['💕','💗','💓','💞','🩷','❤️','💝','💖'];
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('div');
    h.className = 'heart-particle';
    h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (7 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 9) + 's';
    h.style.fontSize = (0.7 + Math.random() * 1.2) + 'rem';
    document.body.appendChild(h);
  }
</script>
</body>
</html>
